name: Deploy Terraform environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
          - all

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment == 'all' && '["dev","stage","prod"]' || format('["{0}"]', inputs.environment)) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: terraform-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare image coordinates
        id: image
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$TF_STATE_BUCKET"
          test -n "$ECR_REPOSITORY"
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          REPOSITORY_URI="$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --query 'repositories[0].repositoryUri' --output text)"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push application image
        run: |
          set -euo pipefail
          docker build -t "${{ steps.image.outputs.uri }}:${{ steps.image.outputs.tag }}" app
          docker push "${{ steps.image.outputs.uri }}:${{ steps.image.outputs.tag }}"

      - name: Initialize Terraform state
        working-directory: infra/live/${{ matrix.environment }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform
        working-directory: infra/live/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Plan infrastructure
        working-directory: infra/live/${{ matrix.environment }}
        run: terraform plan -input=false -no-color -out=deployment.tfplan -var="image_tag=${{ steps.image.outputs.tag }}"

      - name: Apply infrastructure
        working-directory: infra/live/${{ matrix.environment }}
        run: terraform apply -input=false -auto-approve deployment.tfplan

      - name: Show endpoints
        working-directory: infra/live/${{ matrix.environment }}
        run: |
          echo "### ${{ matrix.environment }} endpoints" >> "$GITHUB_STEP_SUMMARY"
          echo "API: $(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "ECS: $(terraform output -raw ecs_url)" >> "$GITHUB_STEP_SUMMARY"
